name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "انتشار عمومی (Release + آینه) — برای نسخه‌های تست خاموش بماند"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --install "ndk;26.3.11579264" > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Restore libbox AAR cache
        id: aar
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          # aar4 — حیاتی: پچ Seq (لودر پروسه‌ای) عوض شده؛ کلید باید bump شود تا کشِ
          # قدیمیِ دوران سایفون (که به‌جای «:lantern»، «:psiphon» را چک می‌کرد) استفاده نشود.
          # همین باگ باعث می‌شد موتور لنترن هرگز پورت باز نکند (ریشه‌ی «اتصال برقرار نمیشه»).  
          key: libbox-v1.11.15-aar4
          save-always: true

      - name: Build sing-box core (libbox AAR)
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          # ---- VEX PATCH: go.Seq process-aware library loading ----
          # دو ران‌تایم Go در یک اپ داریم: libbox (پروسه‌ی اصلی) و libgojni (پروسه‌ی :lantern).
          # بلوک static کلاس go.Seq فقط یک کتابخانه را load می‌کند و native init فقط یک‌بار
          # اجرا می‌شود؛ پس در پروسه‌ی :lantern باید gojni و در پروسه‌ی اصلی box بارگذاری شود،
          # وگرنه یکی از دو موتور کرش می‌کند. gobind بعداً «gojni» را با libname جایگزین می‌کند
          # (شاخه‌ی else)، برای همین مسیر لنترن با "go"+"jni" نوشته شده تا دست‌نخورده بماند.
          GMOD="$(go env GOMODCACHE)/github.com/sagernet/gomobile@v0.1.4/bind/java/Seq.java"
          ls -l "$GMOD"
          # فایل‌های کش ماژول فقط‌خواندنی‌اند — اول اجازه‌ی نوشتن بده
          chmod u+w "$GMOD"
          python3 - "$GMOD" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          old = '\tstatic {\n\t\tSystem.loadLibrary("gojni");\n\t\tinit();\n\t\tUniverse.touch();\n\t}'
          assert old in s, 'Seq.java static block not found'
          new = (
              '\tstatic {\n'
              '\t\t// VEX PATCH: process-aware bridge library selection\n'
              '\t\tString __vp = vexProcessName();\n'
              '\t\tboolean __isLantern = __vp != null && (__vp.endsWith(":lantern") || __vp.endsWith(":psiphon"));\n'
              '\t\tif (__isLantern) {\n'
              '\t\t\tSystem.loadLibrary("go" + "jni");\n'
              '\t\t} else {\n'
              '\t\t\tSystem.loadLibrary("gojni");\n'
              '\t\t}\n'
              '\t\tinit();\n'
              '\t\tUniverse.touch();\n'
              '\t}\n'
              '\n'
              '\tprivate static String vexProcessName() {\n'
              '\t\ttry {\n'
              '\t\t\tjava.io.BufferedReader __r = new java.io.BufferedReader(new java.io.FileReader("/proc/self/cmdline"));\n'
              '\t\t\tStringBuilder __sb = new StringBuilder();\n'
              '\t\t\tint __c;\n'
              '\t\t\twhile ((__c = __r.read()) > 0) { __sb.append((char) __c); }\n'
              '\t\t\t__r.close();\n'
              '\t\t\treturn __sb.toString();\n'
              '\t\t} catch (Throwable __t) {\n'
              '\t\t\treturn null;\n'
              '\t\t}\n'
              '\t}'
          )
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print('Seq.java patched for process-aware loading (main=box, :lantern=gojni)')
          PY
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cd /tmp/sing-box
          gomobile bind -v \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=v1.11.15 -s -w -buildid=" \
            -tags "with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api" \
            -o "$GITHUB_WORKSPACE/app/libs/libbox.aar" \
            ./experimental/libbox
          ls -lh "$GITHUB_WORKSPACE/app/libs/"
          # ---- SELF-CHECK: کلاس go/Seq داخل AAR حتماً باید «:lantern» را چک کند ----
          # (اگر کش قدیمی برگردد یا پچ اعمال نشود، بیلد همان‌جا می‌شکند — نه بعداً روی گوشی)
          python3 - <<'PY'
          import zipfile, io, os
          p = os.path.join(os.environ['GITHUB_WORKSPACE'], 'app', 'libs', 'libbox.aar')
          z = zipfile.ZipFile(p)
          inner = zipfile.ZipFile(io.BytesIO(z.read('classes.jar')))
          raw = inner.read('go/Seq.class')
          assert b':lantern' in raw, 'FATAL: go/Seq.class lacks :lantern check — cache/patch problem!'
          print('SELF-CHECK OK: go/Seq process-aware loader contains :lantern')
          PY

      - name: Verify cached libbox AAR has :lantern loader (skip-build path)
        if: steps.aar.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          import zipfile, io, os
          p = os.path.join(os.environ['GITHUB_WORKSPACE'], 'app', 'libs', 'libbox.aar')
          z = zipfile.ZipFile(p)
          inner = zipfile.ZipFile(io.BytesIO(z.read('classes.jar')))
          raw = inner.read('go/Seq.class')
          if b':lantern' not in raw:
              raise SystemExit('FATAL: cached libbox.aar is stale (no :lantern loader) — bump cache key!')
          print('SELF-CHECK OK: cached go/Seq contains :lantern')
          PY

      - name: Prepare Lantern classes+native libs (strip duplicate gomobile runtime go.*)
        run: |
          # SDK رسمی لنترن (getlantern/lanternsdk-android v1.0.1 — هسته‌ی flashlight v7)
          # ساختار AAR: classes.jar = io.lantern.sdk.*  ·  libs/liblantern.jar = go.* + lantern.*
          # ۱) ادغام دو JAR بدون go/* تکراری → app/libs/lantern-classes.jar (JAR ساده —
          #    بدون هیچ ترنسفورم AAR، همیشه برای کامپایلر Kotlin دیده می‌شود)
          # ۲) libgojni.so (flashlight) → app/src/main/jniLibs/<abi>/ (پکیجینگ مستقیم، بدون AAR)
          curl -fsSL --retry 3 -o /tmp/lantern.aar \
            "https://github.com/getlantern/lanternsdk-android/releases/download/v1.0.1/lanternsdk-android-1.0.1.aar"
          ls -lh /tmp/lantern.aar
          python3 - <<'PY'
          import zipfile, io, os
          src = '/tmp/lantern.aar'
          ws = os.environ['GITHUB_WORKSPACE']
          zin = zipfile.ZipFile(src)
          buf = io.BytesIO()
          yo = zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED)
          kept = 0
          # classes.jar اصلی (io.lantern.sdk.*)
          inner = zipfile.ZipFile(io.BytesIO(zin.read('classes.jar')))
          for n in inner.namelist():
              if n.startswith('go/'):
                  continue
              yo.writestr(n, inner.read(n)); kept += 1
          # libs/liblantern.jar (go.* + lantern.* — بایندهای gobind هسته‌ی Go)
          inner2 = zipfile.ZipFile(io.BytesIO(zin.read('libs/liblantern.jar')))
          for n in inner2.namelist():
              if n.startswith('go/'):
                  continue
              yo.writestr(n, inner2.read(n)); kept += 1
          yo.close()
          libs = os.path.join(ws, 'app', 'libs')
          os.makedirs(libs, exist_ok=True)
          with open(os.path.join(libs, 'lantern-classes.jar'), 'wb') as f:
              f.write(buf.getvalue())
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              d = os.path.join(ws, 'app', 'src', 'main', 'jniLibs', abi)
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, 'libgojni.so'), 'wb') as f:
                  f.write(zin.read('jni/' + abi + '/libgojni.so'))
          print('lantern-classes.jar:', kept, 'classes; libgojni.so (flashlight) extracted for arm64+armv7')
          # self-check
          zc = zipfile.ZipFile(io.BytesIO(buf.getvalue()))
          names = zc.namelist()
          assert 'lantern/LanternClient.class' in names, 'LanternClient missing!'
          assert 'lantern/Lantern.class' in names, 'lantern.Lantern facade missing!'
          assert 'lantern/StartResult.class' in names, 'StartResult missing!'
          assert 'io/lantern/sdk/LanternManager.class' in names, 'LanternManager missing!'
          assert not any(n.startswith('go/') for n in names), 'go/* not stripped!'
          so = os.path.join(ws, 'app', 'src', 'main', 'jniLibs', 'arm64-v8a', 'libgojni.so')
          assert os.path.getsize(so) > 10_000_000, 'libgojni.so too small'
          print('SELF-CHECK OK')
          PY
          # اعتبارسنجی با ابزار واقعی جاوا
          cd /tmp && rm -rf lanchk && mkdir lanchk && cd lanchk
          cp "$GITHUB_WORKSPACE/app/libs/lantern-classes.jar" .
          cat > T.java <<'J'
          public class T {
            lantern.LanternClient c = lantern.Lantern.newLanternClient();
            // کانستراکتور LanternManager خصوصی است — فقط رزولوشن نوع چک می‌شود
            io.lantern.sdk.LanternManager m = null;
          }
          J
          "$JAVA_HOME/bin/javac" -nowarn -cp lantern-classes.jar T.java && echo "JAVAC RESOLVES LanternClient OK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: "Debug: verify lantern on compile classpath"
        run: |
          gradle :app:dependencies --configuration releaseCompileClasspath --no-daemon -q > /tmp/deps.txt || true
          grep -iE "lantern|libbox|app/libs" /tmp/deps.txt || echo "!! lantern/libbox NOT on compile classpath"

      - name: Read version
        id: ver
        run: |
          echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "c=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK (signature + integrity) — fail build if invalid
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          python3 - <<'PY'
          import zipfile, struct, sys
          p = 'app/build/outputs/apk/release/app-release.apk'
          z = zipfile.ZipFile(p)
          assert z.testzip() is None, 'zip corrupt'
          assert 'AndroidManifest.xml' in z.namelist(), 'no manifest'
          assert any(n.endswith('.dex') for n in z.namelist()), 'no dex'
          arsc = z.getinfo('resources.arsc')
          assert arsc.compress_type == 0, 'resources.arsc must be STORED'
          data = open(p,'rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          cd = struct.unpack('<I', data[eocd+16:eocd+20])[0]
          assert data[cd-16:cd] == b'APK Sig Block 42', 'no v2 signing block'
          print('APK structure OK:', len(z.namelist()), 'entries')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vex-client-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (public download link)
        # [V5.10-TEST] انتشار فقط با اجازه‌ی صریح (workflow_dispatch با publish_release=true)
        # — نسخه‌های تست فقط artifact می‌شوند و هیچ Release/آینه‌ای ساخته نمی‌شود
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="Vex-Client-${TAG}.apk"
          cp "$SRC" "$NAME"
          cp "$SRC" "Vex-Client-latest.apk"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$NAME")
          MB=$(( (SIZE + 1048575) / 1048576 ))
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$NAME" "Vex-Client-latest.apk" \
            --title "VEX CLIENT $TAG" \
            --notes "دانلود مستقیم APK — هسته‌ی واقعی sing-box v1.11.15 ✅ امضای verified
          ➖➖➖➖➖➖➖➖➖➖➖➖➖➖
          **راهنمای نصب (مهم):**
          1. فقط همین فایل **${NAME}** را از پایین همین صفحه دانلود کن (فایل ZIP اکشن‌های گیت‌هاب را نصب نکن)
          2. اگر نسخه‌ی قبلی Vex روی گوشی است، اول آن را **حذف کن** بعد نصب کن
          3. حجم فایل دانلودی باید دقیقاً **${SIZE} بایت (≈ ${MB} مگابایت)** باشد — اگر کمتر بود، دانلود ناقص است؛ دوباره دانلود کن (این مهم‌ترین دلیل خطای «بسته معتبر نیست» است)
          4. اجازه‌ی «نصب برنامه‌های ناشناس» را به مرورگر/فایل‌منیجر بده
          5. اگر دانلود از گیت‌هاب ناقص شد، لینک جایگزین (کلادفلر): **https://demonvpn.shop/apk**

          **SHA-256 (برای اطمینان):** ${SHA}

          تازه در این نسخه (V5.9 — ضد «process is bad» + لنترن قوی): خطای «Unable to launch app … process is bad» ریشه‌ای رفع شد — پروسه‌ی لنترن دیگر هرگز پشت‌سرهم kill و black-list نمی‌شود (حداکثر ۲ پروسه در هر جلسه + فاصله‌ی امن + انتظار برای مرگ واقعی پروسه با چک PID) · بوت مجدد «درون-پروسه‌ای» flashlight اضافه شد — بعد از هر شکست، همان پروسه با نمونه‌ی نو و کانفیگ تازه دوباره بوت می‌شود بدون ساخت پروسه‌ی جدید · هر بوت لنترن یک پوشه‌ی کانفیگ کاملاً تازه می‌گیرد — کانفیگ خراب/مسوم نسخه‌های قبل دیگر هیچ بوت را نمی‌کشد و هر بار بهترین سرور از شبکه‌ی ابری لنترن انتخاب می‌شود · سپر کرش پروسه‌ی لنترن: هیچ استثنایی پروسه را نمی‌کشد · قطع سرور لنترن = انتخاب بی‌صدای سرور جایگزین لنترن (بدون هیچ پیام و بدون قطعی در UI) · قانون نهایی کاربر: فقط وقتی لنترن کلاً نشد، بی‌صدا روی «بهترین سرور Vex» سوییچ می‌شود (استخر urltest) — در حال اتصال هم و وسط جلسه هم · گزارش تشخیصی کامل لنترن (وضعیت + لاگ بوت + آخرین کرش) در «جزئیات خطا» قابل مشاهده است

          پروتکل‌ها: VLESS (TLS/Reality/Vision/WS/gRPC/HTTPUpgrade) · VMess · Trojan · Shadowsocks · Hysteria2 · TUIC · WireGuard"

      - name: Refresh APK mirror on Cloudflare Pages (vex-gate2 /apk)
        # [V5.10-TEST] مثل Release — فقط با انتشار صریح (نسخه‌ی تست آینه را دست نمی‌زند)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="Vex-Client-${TAG}.apk"
          rm -rf /tmp/vex-cf
          mkdir -p /tmp/vex-cf/parts
          cp cloudflare/_worker.js /tmp/vex-cf/_worker.js
          cp cloudflare/wrangler.toml /tmp/vex-cf/wrangler.toml
          cp "$SRC" /tmp/vex-cf/parts/vex.apk
          cd /tmp/vex-cf/parts
          split -b 20m -d vex.apk vex.part-
          SIZE=$(stat -c%s vex.apk)
          PARTS=$(ls vex.part-* | wc -l)
          rm vex.apk
          # code/ver برای اندپوینت /v1/app/latest (بروزرسانی خودکار درون‌برنامه‌ای)
          printf '{"name":"%s","size":%s,"parts":%s,"code":%s,"ver":"%s"}' "$NAME" "$SIZE" "$PARTS" "${{ steps.ver.outputs.c }}" "${{ steps.ver.outputs.v }}" > manifest.json
          cd /tmp/vex-cf
          # wrangler.toml در همان پوشه باشد تا bindings (D1/vars) اعمال شود
          npx --yes wrangler@3 pages deploy . --project-name vex-gate2 --branch main --commit-dirty=true
