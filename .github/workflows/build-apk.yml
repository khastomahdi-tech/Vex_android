name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --install "ndk;26.3.11579264" > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Restore libbox AAR cache
        id: aar
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-v1.11.15-aar3
          save-always: true

      - name: Build sing-box core (libbox AAR)
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          # ---- VEX PATCH: go.Seq process-aware library loading ----
          # دو ران‌تایم Go در یک اپ داریم: libbox (پروسه‌ی اصلی) و libgojni (پروسه‌ی :psiphon).
          # بلوک static کلاس go.Seq فقط یک کتابخانه را load می‌کند و native init فقط یک‌بار
          # اجرا می‌شود؛ پس در پروسه‌ی :psiphon باید gojni و در پروسه‌ی اصلی box بارگذاری شود،
          # وگرنه یکی از دو موتور کرش می‌کند. gobind بعداً «gojni» را با libname جایگزین می‌کند
          # (شاخه‌ی else)، برای همین مسیر سایفون با "go"+"jni" نوشته شده تا دست‌نخورده بماند.
          GMOD="$(go env GOMODCACHE)/github.com/sagernet/gomobile@v0.1.4/bind/java/Seq.java"
          ls -l "$GMOD"
          # فایل‌های کش ماژول فقط‌خواندنی‌اند — اول اجازه‌ی نوشتن بده
          chmod u+w "$GMOD"
          python3 - "$GMOD" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          old = '\tstatic {\n\t\tSystem.loadLibrary("gojni");\n\t\tinit();\n\t\tUniverse.touch();\n\t}'
          assert old in s, 'Seq.java static block not found'
          new = (
              '\tstatic {\n'
              '\t\t// VEX PATCH: process-aware bridge library selection\n'
              '\t\tString __vp = vexProcessName();\n'
              '\t\tif (__vp != null && __vp.endsWith(":psiphon")) {\n'
              '\t\t\tSystem.loadLibrary("go" + "jni");\n'
              '\t\t} else {\n'
              '\t\t\tSystem.loadLibrary("gojni");\n'
              '\t\t}\n'
              '\t\tinit();\n'
              '\t\tUniverse.touch();\n'
              '\t}\n'
              '\n'
              '\tprivate static String vexProcessName() {\n'
              '\t\ttry {\n'
              '\t\t\tjava.io.BufferedReader __r = new java.io.BufferedReader(new java.io.FileReader("/proc/self/cmdline"));\n'
              '\t\t\tStringBuilder __sb = new StringBuilder();\n'
              '\t\t\tint __c;\n'
              '\t\t\twhile ((__c = __r.read()) > 0) { __sb.append((char) __c); }\n'
              '\t\t\t__r.close();\n'
              '\t\t\treturn __sb.toString();\n'
              '\t\t} catch (Throwable __t) {\n'
              '\t\t\treturn null;\n'
              '\t\t}\n'
              '\t}'
          )
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print('Seq.java patched for process-aware loading')
          PY
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cd /tmp/sing-box
          gomobile bind -v \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=v1.11.15 -s -w -buildid=" \
            -tags "with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api" \
            -o "$GITHUB_WORKSPACE/app/libs/libbox.aar" \
            ./experimental/libbox
          ls -lh "$GITHUB_WORKSPACE/app/libs/"

      - name: Prepare Psiphon AAR (strip duplicate gomobile runtime go.*)
        run: |
          curl -fsSL --retry 3 -o /tmp/psi.aar \
            "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar"
          ls -lh /tmp/psi.aar
          # AAR استریپ‌شده در مخزن Maven محلی نصب می‌شود — مسیر استاندارد dependency
          # (fileTree برای این AAR توسط کامپایلر Kotlin دیده نمی‌شد)
          python3 - <<'PY'
          import zipfile, io, os
          src = '/tmp/psi.aar'
          mv = os.path.join(os.environ['GITHUB_WORKSPACE'], 'local-maven',
                            'ca', 'psiphon', 'psiphontunnel', '2.0.42')
          os.makedirs(mv, exist_ok=True)
          zin = zipfile.ZipFile(src)
          # classes.jar تازه و تمیز — entryهای بازیافت‌شده ZipInfo خوانش سخت‌گیر Kotlin را خراب می‌کنند
          inner = zipfile.ZipFile(io.BytesIO(zin.read('classes.jar')))
          buf = io.BytesIO()
          yo = zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED)
          kept = 0
          for n in inner.namelist():
              if n.startswith('go/'):
                  continue
              yo.writestr(n, inner.read(n))
              kept += 1
          yo.close()
          dst = os.path.join(mv, 'psiphontunnel-2.0.42.aar')
          zout = zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED)
          for n in zin.namelist():
              if n == 'classes.jar':
                  zout.writestr('classes.jar', buf.getvalue())
              else:
                  zout.writestr(n, zin.read(n))
          zout.close()
          # JAR کلاس‌ها برای کامپایل صریح (compileOnly) — ترنسفورم AGP برخی AARها را
          # برای کامپایلر Kotlin نمی‌سازد؛ این JAR تضمین می‌کند کلاس‌ها حتماً دیده شوند
          libs = os.path.join(os.environ['GITHUB_WORKSPACE'], 'app', 'libs')
          os.makedirs(libs, exist_ok=True)
          with open(os.path.join(libs, 'psiphon-classes.jar'), 'wb') as f:
              f.write(buf.getvalue())
          with open(os.path.join(mv, 'psiphontunnel-2.0.42.pom'), 'w') as f:
              pom = (
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd"'
                  ' xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
                  '  <modelVersion>4.0.0</modelVersion>\n'
                  '  <groupId>ca.psiphon</groupId>\n'
                  '  <artifactId>psiphontunnel</artifactId>\n'
                  '  <version>2.0.42</version>\n'
                  '  <packaging>aar</packaging>\n'
                  '</project>\n')
              f.write(pom)
          print('installed to local maven:', os.path.getsize(dst), 'bytes;', kept, 'classes kept')
          # self-check
          z = zipfile.ZipFile(dst)
          cj = zipfile.ZipFile(io.BytesIO(z.read('classes.jar')))
          assert 'ca/psiphon/PsiphonTunnel.class' in cj.namelist(), 'PsiphonTunnel missing!'
          assert not any(n.startswith('go/') for n in cj.namelist()), 'go/* not stripped!'
          print('SELF-CHECK OK: PsiphonTunnel present, go/* stripped')
          PY
          # اعتبارسنجی با ابزار واقعی جاوا
          cd /tmp && rm -rf psichk && mkdir psichk && cd psichk
          "$JAVA_HOME/bin/jar" xf "$GITHUB_WORKSPACE/local-maven/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar" classes.jar
          "$JAVA_HOME/bin/jar" tf classes.jar | grep -c "ca/psiphon/" || true
          cat > T.java <<'J'
          public class T { ca.psiphon.PsiphonTunnel.HostService h; }
          J
          "$JAVA_HOME/bin/javac" -nowarn -cp classes.jar T.java && echo "JAVAC RESOLVES PsiphonTunnel OK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: "Debug: verify psiphon on compile classpath"
        run: |
          gradle :app:dependencies --configuration releaseCompileClasspath --no-daemon -q > /tmp/deps.txt || true
          grep -iE "psiphon|libbox|app/libs" /tmp/deps.txt || echo "!! psiphon/libbox NOT on compile classpath"

      - name: Read version
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK (signature + integrity) — fail build if invalid
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          python3 - <<'PY'
          import zipfile, struct, sys
          p = 'app/build/outputs/apk/release/app-release.apk'
          z = zipfile.ZipFile(p)
          assert z.testzip() is None, 'zip corrupt'
          assert 'AndroidManifest.xml' in z.namelist(), 'no manifest'
          assert any(n.endswith('.dex') for n in z.namelist()), 'no dex'
          arsc = z.getinfo('resources.arsc')
          assert arsc.compress_type == 0, 'resources.arsc must be STORED'
          data = open(p,'rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          cd = struct.unpack('<I', data[eocd+16:eocd+20])[0]
          assert data[cd-16:cd] == b'APK Sig Block 42', 'no v2 signing block'
          print('APK structure OK:', len(z.namelist()), 'entries')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vex-client-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (public download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="Vex-Client-${TAG}.apk"
          cp "$SRC" "$NAME"
          cp "$SRC" "Vex-Client-latest.apk"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$NAME")
          MB=$(( (SIZE + 1048575) / 1048576 ))
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$NAME" "Vex-Client-latest.apk" \
            --title "VEX CLIENT $TAG" \
            --notes "دانلود مستقیم APK — هسته‌ی واقعی sing-box v1.11.15 ✅ امضای verified
          ➖➖➖➖➖➖➖➖➖➖➖➖➖➖
          **راهنمای نصب (مهم):**
          1. فقط همین فایل **${NAME}** را از پایین همین صفحه دانلود کن (فایل ZIP اکشن‌های گیت‌هاب را نصب نکن)
          2. اگر نسخه‌ی قبلی Vex روی گوشی است، اول آن را **حذف کن** بعد نصب کن
          3. حجم فایل دانلودی باید دقیقاً **${SIZE} بایت (≈ ${MB} مگابایت)** باشد — اگر کمتر بود، دانلود ناقص است؛ دوباره دانلود کن (این مهم‌ترین دلیل خطای «بسته معتبر نیست» است)
          4. اجازه‌ی «نصب برنامه‌های ناشناس» را به مرورگر/فایل‌منیجر بده
          5. اگر دانلود از گیت‌هاب ناقص شد، لینک جایگزین (کلادفلر): **https://vex-gate.pages.dev/apk**

          **SHA-256 (برای اطمینان):** ${SHA}

          تازه در این نسخه: کانال پشتیبان گیت‌هاب — وقتی pages.dev در ایران فیلتر باشد، سرورهای رایگان و اعلان‌ها و وضعیت قفل برنامه از گیت‌هاب خوانده می‌شوند (همه‌چیز حتی بدون فیلترشکن کار می‌کند) · پیام درستِ «اتصال به سرور مدیریت برقرار نشد» به‌جای پیام گمراه‌کننده‌ی قبلی · ردیف نسخه‌ی برنامه در تنظیمات واقعی شد (قبلاً همیشه v3.14.0 نشان می‌داد)
          
          پروتکل‌ها: VLESS (TLS/Reality/Vision/WS/gRPC/HTTPUpgrade) · VMess · Trojan · Shadowsocks · Hysteria2 · TUIC · WireGuard"

      - name: Refresh APK mirror on Cloudflare Pages (vex-gate /apk)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="Vex-Client-${TAG}.apk"
          rm -rf /tmp/vex-cf
          mkdir -p /tmp/vex-cf/parts
          cp cloudflare/_worker.js /tmp/vex-cf/_worker.js
          cp "$SRC" /tmp/vex-cf/parts/vex.apk
          cd /tmp/vex-cf/parts
          split -b 20m -d vex.apk vex.part-
          SIZE=$(stat -c%s vex.apk)
          PARTS=$(ls vex.part-* | wc -l)
          rm vex.apk
          printf '{"name":"%s","size":%s,"parts":%s}' "$NAME" "$SIZE" "$PARTS" > manifest.json
          cd /tmp
          npx --yes wrangler@3 pages deploy /tmp/vex-cf --project-name vex-gate --branch main --commit-dirty=true
