<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VEX — پنل مدیریت</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B1226'/><text x='16' y='23' font-size='19' font-weight='bold' text-anchor='middle' fill='%23E8C15A' font-family='Arial'>V</text></svg>" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
  :root{
    --bg:#0B1226; --bg2:#0E1730; --card:#121C38; --card2:#16234A;
    --line:#24335C; --line2:#2E4070;
    --gold:#E8C15A; --gold2:#F5D889;
    --text:#F2F5FB; --muted:#8E9BB8;
    --good:#27BE6D; --bad:#E5484D; --warn:#FB8A34; --blue:#4C8DFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:radial-gradient(1100px 500px at 50% -8%, #17244A 0%, var(--bg) 55%);
    color:var(--text); min-height:100vh;
  }
  a{color:var(--gold); text-decoration:none;}
  ::placeholder{color:#5F6E92;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input,textarea,select{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- ورود ---------- */
  #loginWrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .loginBox{
    width:100%; max-width:420px; background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:22px; padding:34px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .logoV{
    width:64px; height:64px; border-radius:18px; margin:0 auto 14px;
    background:linear-gradient(160deg,#1B2A54,#0D1630); border:1px solid var(--line2);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; color:var(--gold);
  }
  .loginBox h1{font-size:19px; text-align:center; margin-bottom:6px;}
  .loginBox p{font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:20px; line-height:1.9;}
  .inp{
    width:100%; background:#0C142C; color:var(--text); border:1px solid var(--line);
    border-radius:13px; padding:13px 15px; font-size:14px; outline:none; margin-bottom:10px;
    transition:border-color .2s;
  }
  .inp:focus{border-color:var(--gold);}
  .btn{
    background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#1A1408;
    border-radius:13px; padding:12px 18px; font-size:14px; font-weight:700;
    transition:transform .15s, opacity .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line2); font-weight:600;}
  .btn.danger{background:linear-gradient(180deg,#F2635F,#E5484D); color:#fff;}
  .btn.good{background:linear-gradient(180deg,#3EDC85,#27BE6D); color:#06290F;}
  .btn.small{padding:7px 13px; font-size:12px; border-radius:10px;}
  .btn.wfull{width:100%;}
  #loginErr{color:var(--bad); font-size:12.5px; text-align:center; min-height:18px; margin-top:8px;}

  /* ---------- پوسته‌ی اصلی ---------- */
  #appWrap{max-width:1080px; margin:0 auto; padding:18px 16px 60px;}
  .topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .topbar .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px;}
  .brandV{
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#1B2A54,#0D1630); border:1px solid var(--line2);
    color:var(--gold); font-weight:800; font-size:19px;
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    border-radius:999px; padding:6px 13px; border:1px solid var(--line2); background:var(--card);
  }
  .pill.open{color:var(--good); border-color:rgba(39,190,109,.5);}
  .pill.closed{color:var(--bad); border-color:rgba(229,72,77,.5);}
  .spacer{flex:1;}

  .tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px;}
  .tabBtn{
    background:var(--card); color:var(--muted); border:1px solid var(--line);
    border-radius:12px; padding:9px 15px; font-size:13px; font-weight:700;
    transition:all .2s;
  }
  .tabBtn.on{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#1A1408; border-color:var(--gold);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px;}
  .stat{
    background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:17px; padding:15px 16px;
  }
  .stat .t{font-size:12px; color:var(--muted); margin-bottom:7px;}
  .stat .v{font-size:22px; font-weight:800; letter-spacing:.3px;}
  .stat .s{font-size:11px; color:var(--muted); margin-top:5px;}
  .stat.accent .v{color:var(--gold);}

  .card{
    background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:18px; padding:18px; margin-top:16px;
  }
  .card h2{font-size:15.5px; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
  .card .desc{font-size:12px; color:var(--muted); line-height:2; margin-bottom:13px;}
  .row{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
  textarea.inp{min-height:110px; resize:vertical; line-height:1.9; font-size:12.5px;}

  .slist{margin-top:13px; display:flex; flex-direction:column; gap:9px;}
  .srow{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:#0C142C; border:1px solid var(--line); border-radius:14px; padding:11px 13px;
  }
  .srow .name{font-size:13.5px; font-weight:700;}
  .srow .meta{font-size:11px; color:var(--muted); margin-top:3px;}
  .srow .id{color:#5F6E92; font-size:11px;}
  .proto{
    font-size:10px; font-weight:800; color:#fff; background:#C43A32;
    border-radius:7px; padding:3px 8px; letter-spacing:.5px;
  }
  .lblTag{font-size:11px; color:var(--gold); border:1px solid rgba(232,193,90,.45); border-radius:8px; padding:2px 8px;}
  .offTag{font-size:11px; color:var(--warn); border:1px solid rgba(251,138,52,.45); border-radius:8px; padding:2px 8px;}

  .nrow{
    background:#0C142C; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:9px;
  }
  .nrow .nt{font-weight:700; font-size:13.5px;}
  .nrow .nb{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.9;}
  .nrow .nd{font-size:10.5px; color:#5F6E92; margin-top:6px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{color:var(--muted); font-weight:600; text-align:right; padding:8px 9px; border-bottom:1px solid var(--line2); font-size:11.5px; white-space:nowrap;}
  td{padding:9px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:rgba(232,193,90,.04);}
  .ltdir{direction:ltr; text-align:left; font-size:11.5px; color:var(--muted);}

  .ghbar{margin-top:11px;}
  .ghbar .t{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  .ghbar .bar{height:8px; border-radius:99px; background:#0C142C; border:1px solid var(--line); overflow:hidden;}
  .ghbar .fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:99px;}

  .reasons{display:flex; flex-direction:column; gap:8px; margin-top:11px;}
  .reasons button{
    text-align:right; direction:ltr; background:#0C142C; border:1px solid var(--line);
    color:var(--text); border-radius:11px; padding:10px 13px; font-size:12px;
  }
  .reasons button:hover{border-color:var(--gold);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:#1C2A52; border:1px solid var(--line2); color:var(--text);
    border-radius:13px; padding:11px 20px; font-size:13px; z-index:99;
    box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .25s, bottom .25s;
  }
  .toast.show{opacity:1; bottom:32px;}
  .toast.err{border-color:rgba(229,72,77,.6);}

  .kv{display:flex; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:12.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:700;}
  .hint{font-size:11px; color:#5F6E92; line-height:2; margin-top:10px;}
</style>
</head>
<body>

<!-- ================= ورود ================= -->
<div id="loginWrap">
  <div class="loginBox">
    <div class="logoV">V</div>
    <h1>پنل مدیریت VEX</h1>
    <p>کنترل کامل برنامه از مرورگر — بستن/بازکردن، سرورها، اعلان‌ها، کاربران و به‌روزرسانی</p>
    <input class="inp" id="keyInput" type="password" placeholder="🔑 کلید ادمین را وارد کن" autocomplete="off" />
    <button class="btn wfull" onclick="doLogin()">ورود به پنل</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- ================= پنل ================= -->
<div id="appWrap" class="hidden">
  <div class="topbar">
    <div class="brand"><div class="brandV">V</div><div>VEX <span style="color:var(--muted);font-weight:600;font-size:12px;">پنل مدیریت</span></div></div>
    <div class="spacer"></div>
    <span class="pill open" id="gatePill">🟢 باز</span>
    <button class="btn ghost small" onclick="refreshAll(true)">🔄 تازه‌سازی</button>
    <button class="btn ghost small" onclick="logout()">خروج</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tabBtn on" data-t="ov">📊 نمای کلی</button>
    <button class="tabBtn" data-t="srv">🖥 سرورها</button>
    <button class="tabBtn" data-t="ntf">📢 اعلان‌ها</button>
    <button class="tabBtn" data-t="usr">👥 کاربران</button>
    <button class="tabBtn" data-t="ctl">🔒 کنترل برنامه</button>
    <button class="tabBtn" data-t="set">⚙️ تنظیمات</button>
  </div>

  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= اتصال به بک‌اند (worker) ================= */
const HOSTS = [];
function initHosts(){
  const h = location.hostname;
  if (h === "demonvpn.shop" || h.endsWith(".demonvpn.shop")) HOSTS.push(location.origin);
  for (const x of ["https://demonvpn.shop", "https://vex-gate.pages.dev"])
    if (!HOSTS.includes(x)) HOSTS.push(x);
}
initHosts();
let HOST = localStorage.getItem("vex_admin_host") || HOSTS[0];

function adminKey(){ return localStorage.getItem("vex_admin_key") || ""; }

async function api(path, opts = {}, rawBody = null){
  const key = adminKey();
  let lastErr = null;
  for (let i = 0; i < HOSTS.length; i++){
    const h = (i === 0) ? HOST : HOSTS[i];
    try {
      const r = await fetch(h + path, {
        method: opts.method || "GET",
        headers: { "X-Admin-Key": key, "Content-Type": "application/json" },
        body: rawBody ? JSON.stringify(rawBody) : undefined
      });
      if (r.status === 401) throw new Error("auth");
      if (!r.ok) { lastErr = new Error("http " + r.status); continue; }
      const j = await r.json();
      if (h !== HOST){ HOST = h; localStorage.setItem("vex_admin_host", h); }
      return j;
    } catch (e){
      if (e.message === "auth") throw e;
      lastErr = e;
    }
  }
  throw lastErr || new Error("net");
}

/* ================= ابزار UI ================= */
let toastTimer = null;
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast" + (isErr ? " err" : ""), 2600);
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmtB(n){
  n = Number(n) || 0;
  const u = ["B","KB","MB","GB","TB"];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i ? v.toFixed(2) : String(v)) + " " + u[i];
}
function flagEmoji(cc){
  if (!cc || cc.length !== 2) return "";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function dt(ms){
  if (!ms) return "—";
  const d = new Date(Number(ms));
  return d.toISOString().slice(0,10) + " " + d.toISOString().slice(11,16);
}
function ago(ms){
  const s = Math.max(0, (Date.now() - Number(ms)) / 1000);
  if (s < 90) return Math.round(s) + " ثانیه پیش";
  if (s < 5400) return Math.round(s/60) + " دقیقه پیش";
  if (s < 172800) return Math.round(s/3600) + " ساعت پیش";
  return Math.round(s/86400) + " روز پیش";
}

/* ================= ورود / خروج ================= */
async function doLogin(){
  const inp = document.getElementById("keyInput");
  const err = document.getElementById("loginErr");
  const k = inp.value.trim();
  if (!k){ err.textContent = "کلید را وارد کن"; return; }
  localStorage.setItem("vex_admin_key", k);
  err.textContent = "در حال بررسی…";
  let ok = false, authFail = false;
  for (const h of HOSTS){
    try {
      const r = await fetch(h + "/admin/login", { method: "POST", headers: { "X-Admin-Key": k } });
      if (r.ok){ ok = true; HOST = h; localStorage.setItem("vex_admin_host", h); break; }
      if (r.status === 401) authFail = true;
    } catch (e){}
  }
  if (ok){ err.textContent = ""; enterApp(); }
  else { err.textContent = authFail ? "❌ کلید اشتباه است" : "❌ به سرور دسترسی نبود — دوباره تلاش کن"; }
}
function logout(){
  localStorage.removeItem("vex_admin_key");
  location.reload();
}
function enterApp(){
  document.getElementById("loginWrap").classList.add("hidden");
  document.getElementById("appWrap").classList.remove("hidden");
  refreshAll(true);
}

/* ================= داده‌های مشترک ================= */
let OV = null, SET = null, autoTimer = null, curTab = "ov";

async function refreshAll(manual){
  try {
    const [ov, st] = await Promise.all([api("/admin/overview"), api("/admin/settings")]);
    OV = ov; SET = st;
    renderGatePill();
    render(curTab);
    if (manual) toast("✅ به‌روزرسانی شد");
  } catch (e){
    if (e.message === "auth"){ logout(); return; }
    if (manual) toast("❌ ارتباط با سرور برقرار نشد", true);
  }
}
function renderGatePill(){
  const p = document.getElementById("gatePill");
  if (!OV) return;
  if (OV.gate === "closed"){ p.className = "pill closed"; p.textContent = "🔒 بسته"; }
  else { p.className = "pill open"; p.textContent = "🟢 باز"; }
}

/* ================= تب‌ها ================= */
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tabBtn");
  if (!b) return;
  document.querySelectorAll(".tabBtn").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  curTab = b.dataset.t;
  render(curTab);
});

function render(tab){
  const v = document.getElementById("view");
  if (tab === "ov") renderOverview(v);
  else if (tab === "srv") renderServers(v);
  else if (tab === "ntf") renderNotifs(v);
  else if (tab === "usr") renderUsers(v);
  else if (tab === "ctl") renderControl(v);
  else renderSettings(v);
}

/* ================= ۱) نمای کلی ================= */
function statCard(t, v, s, accent){
  return '<div class="stat' + (accent ? ' accent' : '') + '">' +
    '<div class="t">' + t + '</div><div class="v">' + v + '</div>' +
    (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
}
function renderOverview(v){
  if (!OV){ v.innerHTML = '<div class="card desc">در حال دریافت…</div>'; return; }
  const gh = OV.github || {};
  let ghHtml = "";
  if (gh.ok && (gh.rows || []).length){
    const max = Math.max(1, ...gh.rows.map(r => r.ver + r.lat));
    ghHtml = '<div class="card"><h2>📥 نصب به تفکیک نسخه (از گیت‌هاب)</h2>' +
      '<div class="desc">هر دانلود APK از صفحه‌ی Releases = یک نصب · کل: <b style="color:var(--gold)">' + gh.total + '</b></div>';
    for (const r of gh.rows.slice(0, 10)){
      const w = Math.max(3, Math.round((r.ver + r.lat) / max * 100));
      ghHtml += '<div class="ghbar"><div class="t"><span>' + esc(r.tag) + '</span><span>' + (r.ver + r.lat) + ' نصب</span></div>' +
        '<div class="bar"><div class="fill" style="width:' + w + '%"></div></div></div>';
    }
    ghHtml += '</div>';
  }
  const tf = (OV.traffic && OV.traffic.free) || 0, tp = (OV.traffic && OV.traffic.private) || 0;
  v.innerHTML =
    '<div class="grid">' +
      statCard("👥 کل کاربران", OV.users, "نصب‌های یکتا", true) +
      statCard("🆕 نصب ۲۴ ساعت", OV.todayInstalls, "روزانه") +
      statCard("🟢 فعال ۲۴ ساعت", OV.active24h, "برنامه را باز کرده‌اند") +
      statCard("🔁 مجموع ورودها", OV.opens, "همه‌ی بازشدن‌ها") +
      statCard("🖥 سرورهای رایگان", OV.freeServers, "فعال در برنامه‌ی کاربران") +
      statCard("📢 اعلان‌ها", OV.notifications, "ارسال‌شده تا امروز") +
      statCard("🆓 مصرف رایگان", fmtB(tf), "کل کاربران") +
      statCard("🔑 مصرف شخصی", fmtB(tp), "سرور خود کاربران") +
      statCard("📥 دانلود APK", (gh.ok ? gh.total : "—"), gh.ok ? esc(gh.repo || "") : "گیت‌هاب در دسترس نبود") +
    '</div>' + ghHtml;
}

/* ================= ۲) سرورها ================= */
async function renderServers(v){
  v.innerHTML =
    '<div class="card"><h2>➕ افزودن سرور رایگان</h2>' +
    '<div class="desc">هر خط یک کانفیگ: <code>vless:// · vmess:// · trojan:// · ss:// · wg://</code><br>' +
    'پیشوند (نشان کنار نام در برنامه): <code>🇩🇪 ویژه | vless://…</code> — فایل کامل وایرگارد هم قابل پیست است.</div>' +
    '<textarea class="inp" id="fsText" placeholder="کانفیگ‌ها را اینجا پیست کن…"></textarea>' +
    '<div class="row" style="margin-top:10px;"><button class="btn" onclick="addServers()">افزودن به برنامه‌ی همه‌ی کاربران</button>' +
    '<button class="btn ghost" onclick="render(curTab)">پاک‌کردن</button></div></div>' +
    '<div class="card"><h2>🖥 سرورهای فعلی</h2>' +
    '<div class="row"><button class="btn ghost small" onclick="loadServers()">🔄 تازه‌سازی لیست</button>' +
    '<button class="btn danger small" onclick="delAllServers()">🗑 حذف همه</button></div>' +
    '<div class="slist" id="fsList"><div class="desc">در حال دریافت…</div></div></div>';
  loadServers();
}
async function loadServers(){
  const box = document.getElementById("fsList");
  if (!box) return;
  try {
    const j = await api("/admin/servers");
    const list = j.servers || [];
    if (!list.length){ box.innerHTML = '<div class="desc">لیست خالی است — اولین کانفیگ را از کادر بالا اضافه کن.</div>'; return; }
    box.innerHTML = list.map(s =>
      '<div class="srow">' +
        '<span class="proto">' + esc((s.proto || "?").toUpperCase()) + '</span>' +
        '<div style="flex:1;min-width:150px;">' +
          '<div class="name">' + (s.label ? '<span class="lblTag">' + esc(s.label) + '</span> ' : '') + esc(s.name || "—") + '</div>' +
          '<div class="meta">#' + s.id + ' · ' + (s.raw_len || 0) + ' بایت · ' + dt(s.added_at) + '</div>' +
        '</div>' +
        (s.enabled ? '' : '<span class="offTag">خاموش</span>') +
        '<button class="btn ghost small" onclick="editLabel(' + s.id + ')">🏷 پیشوند</button>' +
        '<button class="btn ghost small" onclick="toggleFs(' + s.id + ',' + (s.enabled ? 0 : 1) + ')">' + (s.enabled ? "⏸ خاموش" : "▶️ روشن") + '</button>' +
        '<button class="btn danger small" onclick="delServer(' + s.id + ')">🗑</button>' +
      '</div>').join("");
  } catch (e){
    box.innerHTML = '<div class="desc">❌ دریافت لیست ناموفق بود</div>';
  }
}
async function addServers(){
  const el = document.getElementById("fsText");
  if (!el || !el.value.trim()){ toast("اول کانفیگ را وارد کن", true); return; }
  try {
    const j = await api("/admin/servers", { method: "POST" }, { text: el.value });
    toast("✅ " + j.added + " اضافه شد" + (j.dup ? " · " + j.dup + " تکرار" : "") + (j.bad ? " · " + j.bad + " نامعتبر" : ""));
    el.value = "";
    loadServers();
  } catch (e){ toast(e.message === "auth" ? "کلید اشتباه است" : "افزودن ناموفق بود", true); }
}
async function editLabel(id){
  const v = prompt("پیشوند (ایموجی/متن)؟ — خالی یا «-» یعنی حذف پیشوند");
  if (v === null) return;
  await api("/admin/servers/update", { method: "POST" }, { id, label: v });
  toast("🏷 پیشوند ثبت شد"); loadServers();
}
async function toggleFs(id, en){
  await api("/admin/servers/update", { method: "POST" }, { id, enabled: !!en });
  toast(en ? "▶️ سرور روشن شد" : "⏸ سرور خاموش شد"); loadServers();
}
async function delServer(id){
  await api("/admin/servers/delete", { method: "POST" }, { id });
  toast("🗑 حذف شد"); loadServers();
}
async function delAllServers(){
  if (!confirm("⚠️ همه‌ی سرورهای رایگان حذف شوند؟ این کار برگشت‌پذیر نیست.")) return;
  await api("/admin/servers/delete", { method: "POST" }, { all: true });
  toast("🗑 همه حذف شدند"); loadServers();
}

/* ================= ۳) اعلان‌ها ================= */
async function renderNotifs(v){
  v.innerHTML =
    '<div class="card"><h2>📢 ارسال اعلان همگانی</h2>' +
    '<div class="desc">اعلان به‌صورت نوتیفیکیشن واقعی سیستم بالای صفحه‌ی کاربران می‌آید.<br>' +
    'کاربران آنلاین تا ~۶۰ ثانیه — کاربرانی که برنامه‌شان بسته است حداکثر ~۱۵ دقیقه (ضربان پس‌زمینه‌ی اندروید).</div>' +
    '<input class="inp" id="ntTitle" maxlength="80" placeholder="عنوان اعلان (مثلاً: سرور جدید اضافه شد 🎉)" />' +
    '<textarea class="inp" id="ntBody" maxlength="400" placeholder="متن اعلان (اختیاری)" style="min-height:70px"></textarea>' +
    '<button class="btn" onclick="sendNotif()">ارسال به همه‌ی کاربران</button></div>' +
    '<div class="card"><h2>📜 اعلان‌های اخیر</h2>' +
    '<div id="ntList" class="desc">در حال دریافت…</div></div>';
  loadNotifs();
}
async function loadNotifs(){
  const box = document.getElementById("ntList");
  if (!box) return;
  try {
    const j = await api("/admin/notifications");
    const list = (j.list || []).slice().reverse();
    if (!list.length){ box.innerHTML = "هنوز اعلانی ثبت نشده است."; return; }
    box.innerHTML = list.map(n =>
      '<div class="nrow">' +
        '<div class="nt">#' + n.id + ' · ' + esc(n.title) + '</div>' +
        (n.body ? '<div class="nb">' + esc(n.body) + '</div>' : '') +
        '<div class="nd">' + dt(n.created_at) + '</div>' +
        '<div style="margin-top:8px;"><button class="btn danger small" onclick="delNotif(' + n.id + ')">🗑 حذف</button></div>' +
      '</div>').join("");
  } catch (e){ box.innerHTML = "❌ دریافت ناموفق بود"; }
}
async function sendNotif(){
  const t = document.getElementById("ntTitle").value.trim();
  const b = document.getElementById("ntBody").value.trim();
  if (!t){ toast("عنوان را وارد کن", true); return; }
  try {
    const j = await api("/admin/notifications", { method: "POST" }, { title: t, body: b });
    toast("📢 اعلان #" + (j.id || "?") + " ارسال شد");
    document.getElementById("ntTitle").value = "";
    document.getElementById("ntBody").value = "";
    loadNotifs();
  } catch (e){ toast("ارسال ناموفق بود", true); }
}
async function delNotif(id){
  await api("/admin/notifications/delete", { method: "POST" }, { id });
  toast("🗑 حذف شد"); loadNotifs();
}

/* ================= ۴) کاربران ================= */
async function renderUsers(v){
  v.innerHTML =
    '<div class="card"><h2>👥 کاربران (۱۰۰ مورد آخر)</h2>' +
    '<div class="row"><input class="inp" id="uSearch" placeholder="🔍 جستجو: نام گوشی، IP، کشور، نسخه…" style="max-width:330px" oninput="filterUsers()" />' +
    '<button class="btn ghost small" onclick="loadUsers()">🔄 تازه‌سازی</button></div>' +
    '<div style="overflow-x:auto; margin-top:10px;"><table id="uTable"><thead><tr>' +
    '<th>کاربر</th><th>IP</th><th>نسخه</th><th>اندروید</th><th>ورودها</th><th>مصرف</th><th>آخرین بازدید</th>' +
    '</tr></thead><tbody id="uBody"><tr><td colspan="7">در حال دریافت…</td></tr></tbody></table></div></div>';
  loadUsers();
}
let USERS = [];
async function loadUsers(){
  const body = document.getElementById("uBody");
  if (!body) return;
  try {
    const j = await api("/admin/users");
    USERS = j.users || [];
    filterUsers();
  } catch (e){ body.innerHTML = '<tr><td colspan="7">❌ دریافت ناموفق بود</td></tr>'; }
}
function filterUsers(){
  const body = document.getElementById("uBody");
  if (!body) return;
  const q = (document.getElementById("uSearch")?.value || "").toLowerCase().trim();
  const rows = USERS.filter(u =>
    !q || [u.model, u.ip, u.country, u.ver, u.android, u.lang].some(x => String(x || "").toLowerCase().includes(q)));
  if (!rows.length){ body.innerHTML = '<tr><td colspan="7">چیزی پیدا نشد</td></tr>'; return; }
  body.innerHTML = rows.map(u =>
    '<tr>' +
      '<td><b>' + (u.country ? flagEmoji(u.country) + " " : "") + esc(u.model || "?") + '</b></td>' +
      '<td class="ltdir">' + esc(u.ip || "?") + '</td>' +
      '<td>v' + esc(u.ver || "?") + '</td>' +
      '<td class="ltdir">' + esc(u.android || "?") + '</td>' +
      '<td>' + (u.opens || 1) + '</td>' +
      '<td>' + fmtB(u.bytes) + '</td>' +
      '<td>' + ago(u.last_seen) + '</td>' +
    '</tr>').join("");
}

/* ================= ۵) کنترل برنامه ================= */
const CLOSE_REASONS = [
  ["🛠 Updating the app. Please try again later.", "در حال به‌روزرسانی"],
  ["⚠️ A technical problem occurred. Please try again later.", "مشکل فنی"],
  ["🔒 The admin has closed the app for now. Please try again later.", "بستن توسط مدیر"]
];
async function renderControl(v){
  const gate = OV ? OV.gate : "open";
  const reason = (OV && OV.reason) || "";
  const mv = SET ? (SET.min_ver || 0) : 0;
  v.innerHTML =
    '<div class="card"><h2>🔒 خاموش/روشن کل برنامه (Kill Switch)</h2>' +
    '<div class="desc">وقتی بسته است، کاربران موقع ورود صفحه‌ی «App Access Closed» با دلیل انتخابی می‌بینند و تونل قطع می‌شود.<br>' +
    'وضعیت فعلی: <b style="color:' + (gate === "closed" ? "var(--bad)" : "var(--good)") + '">' + (gate === "closed" ? "بسته 🔒" : "باز 🟢") + '</b>' +
    (gate === "closed" ? ' · پیام فعلی: <code>' + esc(reason) + '</code>' : '') + '</div>' +
    '<div class="row"><button class="btn good" onclick="setGate(\'open\')">🔓 بازکردن برنامه برای همه</button></div>' +
    '<div class="reasons" id="reasons">' +
      CLOSE_REASONS.map((r, i) => '<button onclick="setGate(\'closed\',' + i + ')">🔒 بستن — ' + r[1] + ' <span style="color:var(--muted);font-size:11px;">' + esc(r[0]) + '</span></button>').join("") +
      '<button onclick="customClose()">✍️ بستن با پیام سفارشی…</button>' +
    '</div></div>' +
    '<div class="card"><h2>🔄 حداقل نسخه‌ی مجاز (به‌روزرسانی اجباری نرم)</h2>' +
    '<div class="desc">اگر versionCode کاربر کمتر از این عدد باشد، موقع ورود بنر «🔔 نسخه‌ی جدید منتشر شده» با دکمه‌ی دانلود می‌بیند.<br>' +
    'نسخه‌ی فعلی برنامه: versionCode <b style="color:var(--gold)">30</b> (v3.23.0) — فعلاً: <b>' + (mv || "خاموش") + '</b></div>' +
    '<div class="row"><input class="inp" id="mvInput" type="number" min="0" style="max-width:150px" placeholder="مثلاً 31" value="' + (mv || "") + '" />' +
    '<button class="btn" onclick="saveMinVer()">ثبت</button>' +
    '<button class="btn ghost" onclick="saveMinVer(0)">خاموش‌کردن</button></div></div>';
}
async function setGate(g, idx){
  const body = { gate: g };
  if (g === "closed" && idx !== undefined) body.reason = CLOSE_REASONS[idx][0];
  const j = await api("/admin/gate", { method: "POST" }, body);
  if (OV){ OV.gate = j.gate; OV.reason = j.reason; }
  renderGatePill(); render(curTab);
  toast(g === "closed" ? "🔒 برنامه بسته شد" : "🔓 برنامه باز شد");
}
async function customClose(){
  const r = prompt("پیام انگلیسی که کاربران ببینند:\n(مثلاً: App access closed. We are updating. Please try again later.)");
  if (r === null) return;
  const j = await api("/admin/gate", { method: "POST" }, { gate: "closed", reason: r });
  if (OV){ OV.gate = j.gate; OV.reason = j.reason; }
  renderGatePill(); render(curTab);
  toast("🔒 برنامه بسته شد (پیام سفارشی)");
}
async function saveMinVer(zero){
  const el = document.getElementById("mvInput");
  const n = zero === 0 ? 0 : Math.max(0, Math.round(Number(el.value) || 0));
  const j = await api("/admin/settings", { method: "POST" }, { min_ver: n });
  if (SET) SET.min_ver = j.min_ver;
  toast(n ? "🔄 حداقل نسخه: " + n : "🔄 حداقل نسخه خاموش شد");
  render(curTab);
}

/* ================= ۶) تنظیمات ================= */

  v.innerHTML =
    '<div class="card"><h2>⚙️ وضعیت سرویس</h2>' +
    '<div class="kv"><span class="k">نسخه‌ی بک‌اند (worker)</span><span class="v">v' + (SET ? SET.service_v : "?") + '</span></div>' +
    '<div class="kv"><span class="k">chat_id مدیر (ربات)</span><span class="v">' + esc((SET && SET.owner) || "—") + '</span></div>' +
    '<div class="kv"><span class="k">پنل (دامنه‌ی اصلی)</span><span class="v ltdir">panel.demonvpn.shop</span></div>' +
    '<div class="kv"><span class="k">پنل (پشتیبان)</span><span class="v ltdir">vex-panel.pages.dev</span></div>' +
    '<div class="kv"><span class="k">دروازه‌ی برنامه</span><span class="v ltdir">demonvpn.shop · vex-gate.pages.dev</span></div>' +
    '<div class="kv"><span class="k">دانلود مستقیم APK</span><span class="v ltdir"><a href="https://demonvpn.shop/apk" target="_blank">demonvpn.shop/apk</a></span></div>' +
    '<div class="kv"><span class="k">کانال تلگرام</span><span class="v ltdir"><a href="https://t.me/vex_vpnfree" target="_blank">t.me/vex_vpnfree</a></span></div>' +
    '</div>' +
    '<div class="card"><h2>📝 پیام پیش‌فرض بسته‌بودن</h2>' +
    '<div class="desc">این متن انگلیسی وقتی نشان داده می‌شود که برنامه بسته شده و دلیل خاصی انتخاب نشده باشد.</div>' +
    '<textarea class="inp" id="crInput" style="min-height:64px">' + esc((SET && SET.close_reason) || "") + '</textarea>' +
    '<button class="btn" style="margin-top:9px" onclick="saveCloseReason()">ذخیره پیام</button></div>' +
    '<div class="card"><h2>🔄 همگام‌سازی پشتیبان گیت‌هاب</h2>' +
    '<div class="desc">وضعیت/سرورها/اعلان‌ها به‌صورت JSON در ریپوی گیت‌هاب نوشته می‌شوند تا کاربرانِ بدون فیلترشکن (وقتی pages.dev فیلتر است) هم همه‌چیز را بگیرند. بعد از هر تغییر خودکار همگام می‌شود؛ این دکمه برای اطمینان دستی است.</div>' +
    '<button class="btn ghost" onclick="syncSnaps()">🔄 همگام‌سازی الان</button></div>';
}
async function saveCloseReason(){
  const cr = document.getElementById("crInput").value.trim();
  if (!cr){ toast("متن خالی است", true); return; }
  await api("/admin/settings", { method: "POST" }, { close_reason: cr });
  if (SET) SET.close_reason = cr;
  toast("📝 پیام ذخیره شد");
}
async function syncSnaps(){
  try {
    const j = await api("/admin/syncsnap", { method: "POST" });
    toast("🔄 همگام شد (" + j.servers + " سرور · " + j.notifs + " اعلان · دروازه: " + (j.gate === "closed" ? "بسته" : "باز") + ")");
  } catch (e){ toast("همگام‌سازی ناموفق بود", true); }
}

/* ================= شروع ================= */
document.getElementById("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
(async function boot(){
  if (adminKey()){
    try {
      const [ov, st] = await Promise.all([api("/admin/overview"), api("/admin/settings")]);
      OV = ov; SET = st;
      enterApp();
    } catch (e){
      if (e.message === "auth") localStorage.removeItem("vex_admin_key");
    }
  }
})();
/* تازه‌سازی خودکار هر ۳۰ ثانیه */
setInterval(() => {
  if (!document.getElementById("appWrap").classList.contains("hidden") &&
      !document.hidden && curTab === "ov") refreshAll(false);
}, 30000);
</script>
